  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 2rem; background: #f4f4f4; }
    h2 { margin-bottom: 1rem; color: #111; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    ul a { display: inline-block; padding: 0.5rem 1rem; background: #fff; border: 1px solid #ddd; border-radius: 4px; color: #333; text-decoration: none; font-size: 0.9rem; }
    ul a:hover { background: #f0f0f0; }
    .section { margin-bottom: 2rem; }
    .badge { display: inline-block; margin-top: 0.5rem; background: #dcfce7; color: #166534; padding: 0.2rem 0.7rem; border-radius: 999px; font-size: 0.8rem; }
    .lander-card { background: #fff; border-radius: 8px; padding: 2rem; margin-bottom: 2rem; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .lander-card h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #111; }
    .lander-card p { color: #555; margin-bottom: 1.5rem; line-height: 1.6; }
    .cta { display: block; background: #e63946; color: #fff; padding: 0.85rem 1rem; border-radius: 4px; font-size: 1rem; font-weight: 600; text-decoration: none; margin-bottom: 0.6rem; }
    .cta:hover { background: #c1121f; }
    .timer { color: #888; font-size: 0.85rem; margin-top: 1rem; }
    .debug { margin-top: 1rem; font-size: 0.72rem; color: #aaa; word-break: break-all; }

  <script>
    (function () {
      var visitId = new URLSearchParams(window.location.search).get('visit_id');
      if (!visitId) return;
      document.querySelectorAll('.js-cta').forEach(function (a) {
        var url = new URL(a.href, window.location.href);
        url.searchParams.set('visit_id', visitId);
        a.href = url.toString();
      });
    })();
  </script>
